<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>読書ペースメーカー</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}
*{box-sizing:border-box}body{margin:0;padding:16px;max-width:760px;margin-inline:auto}
header{padding:8px 2px 16px}h1{font-size:1.65rem;margin:0 0 6px}p{line-height:1.55}.muted{color:#65718a;font-size:.9rem}
.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #17203308}
h2{font-size:1.1rem;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.9rem;font-weight:600;margin:10px 0 5px}
input,textarea,button{font:inherit}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:white;color:#172033}
button{border:0;border-radius:10px;padding:12px 14px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:white;width:100%;margin-top:14px}.secondary{background:#e8efff;color:#1d4ed8}.danger{background:#fee2e2;color:#991b1b}.small{padding:8px 10px;font-size:.85rem}
.book{border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-top:12px}
.book-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.book h3{margin:0 0 5px;font-size:1.05rem;overflow-wrap:anywhere}.pill{font-size:.78rem;padding:5px 8px;border-radius:999px;background:#e0f2fe;color:#075985;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:#f8fafc;border-radius:10px;padding:10px}.stat span{display:block;font-size:.75rem;color:#65718a}.stat strong{display:block;font-size:1.1rem;margin-top:4px}
.progress{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden}.bar{height:100%;background:#16a34a;border-radius:20px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions button{flex:1}
details summary{cursor:pointer;font-weight:700}.empty{text-align:center;padding:24px;color:#65718a}
.notice{background:#eff6ff;color:#1e40af;border-radius:10px;padding:11px;font-size:.88rem}
@media(max-width:480px){body{padding:12px}.grid{grid-template-columns:1fr 1fr}.stats{gap:5px}.stat{padding:8px}.stat strong{font-size:1rem}}
</style>
</head>
<body>
<header>
  <h1>📚 読書ペースメーカー</h1>
  <p class="muted">返却期限から逆算して、今日読むページ数を見える化します。</p>
</header>

<section class="card">
  <h2>本を登録する</h2>
  <form id="bookForm">
    <label for="title">本のタイトル *</label>
    <input id="title" required maxlength="120" placeholder="例：かがみの孤城">
    <div class="grid">
      <div><label for="total">総ページ数 *</label><input id="total" type="number" min="1" max="100000" required placeholder="例：320"></div>
      <div><label for="due">返却期限 *</label><input id="due" type="date" required></div>
    </div>
    <div class="grid">
      <div><label for="current">現在の読了ページ</label><input id="current" type="number" min="0" value="0" required></div>
      <div><label for="author">著者（任意）</label><input id="author" maxlength="100" placeholder="著者名"></div>
    </div>
    <button class="primary" type="submit">本を登録する</button>
  </form>
</section>

<section class="card">
  <h2>今日の読書</h2>
  <p class="muted">「今日読んだページ数」を記録すると、読了ページと履歴に反映します。</p>
  <div id="todayPanel" class="empty">本を登録すると、ここから記録できます。</div>
</section>

<section class="card">
  <h2>登録した本 <span id="bookCount" class="muted"></span></h2>
  <div id="bookList"><div class="empty">まだ本が登録されていません。</div></div>
</section>

<section class="card">
  <details>
    <summary>データのバックアップ・復元</summary>
    <p class="muted">記録はこのブラウザー内に保存されます。念のため、ときどきバックアップしてください。</p>
    <div class="actions">
      <button class="secondary" id="exportBtn" type="button">バックアップを書き出す</button>
      <button class="secondary" id="importBtn" type="button">バックアップを読み込む</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
    <p class="muted">※読み込みは現在のデータを置き換えます。</p>
  </details>
</section>
<p class="muted">データは原則この端末・ブラウザー内に保存されます。ブラウザーのデータ削除や別ブラウザーへの変更で消えることがあるため、バックアップをおすすめします。</p>

<script>
const KEY = 'reading_pace_maker_v1';
let books = [];
try { books = JSON.parse(localStorage.getItem(KEY) || '[]'); if (!Array.isArray(books)) books=[]; } catch(e) { books=[]; }
const $ = id => document.getElementById(id);
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
$('due').value = (() => { const d=new Date(); d.setDate(d.getDate()+14); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
function save(){ localStorage.setItem(KEY, JSON.stringify(books)); render(); }
function escapeHtml(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function daysLeft(due){
  const a=new Date(today()+'T00:00:00'), b=new Date(due+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function fmtDate(s){ if(!s)return '未設定'; const [y,m,d]=s.split('-'); return `${y}/${m}/${d}`; }
function progress(b){return Math.min(100,Math.round((b.current/b.total)*100));}
function goal(b){
  const remaining=Math.max(0,b.total-b.current), days=daysLeft(b.due);
  if(remaining===0)return {remaining,days,goal:0,status:'読了'};
  if(days<0)return {remaining,days,goal:null,status:`期限超過 ${Math.abs(days)}日`};
  const available=days+1; // 返却日当日も読める日として数える
  return {remaining,days,goal:Math.ceil(remaining/available),status:days===0?'返却日当日':days<=2?'期限間近':'読書中'};
}
function render(){
  $('bookCount').textContent = `（${books.length}冊）`;
  const list=$('bookList');
  if(!books.length) list.innerHTML='<div class="empty">まだ本が登録されていません。</div>';
  else list.innerHTML=books.map(b=>{
    const g=goal(b), p=progress(b);
    const goalText=g.goal===null?'再計画が必要':g.goal===0?'読了':`${g.goal}ページ/日`;
    const dayText=g.days<0?`期限超過 ${Math.abs(g.days)}日`:g.days===0?'今日が返却日':`返却まで${g.days}日`;
    return `<article class="book">
      <div class="book-top"><div><h3>${escapeHtml(b.title)}</h3><div class="muted">${escapeHtml(b.author||'著者未入力')} ・ ${b.total}ページ</div></div><span class="pill">${escapeHtml(g.status)}</span></div>
      <div class="stats">
        <div class="stat"><span>残り</span><strong>${g.remaining}頁</strong></div>
        <div class="stat"><span>今日からの目標</span><strong>${goalText}</strong></div>
        <div class="stat"><span>返却期限</span><strong>${fmtDate(b.due)}</strong></div>
      </div>
      <div class="progress"><div class="bar" style="width:${p}%"></div></div>
      <div class="muted" style="margin-top:6px">${b.current}/${b.total}ページ（${p}%） ・ ${dayText}</div>
      <div class="actions">
        <button class="secondary small" onclick="logFor('${b.id}')">今日読んだページを記録</button>
        <button class="secondary small" onclick="editBook('${b.id}')">本の情報を編集</button>
        <button class="danger small" onclick="deleteBook('${b.id}')">削除</button>
      </div>
      ${b.history?.length ? `<details style="margin-top:12px"><summary>読書履歴（${b.history.length}件）</summary><ul>${[...b.history].reverse().map(h=>`<li>${fmtDate(h.date)}：${h.pages}ページ（${h.from}→${h.to}ページ）</li>`).join('')}</ul></details>`:''}
    </article>`;
  }).join('');
  const active=books.filter(b=>b.current<b.total);
  $('todayPanel').className=active.length?'':'empty';
  $('todayPanel').innerHTML=active.length?active.map(b=>`<div style="text-align:left;margin:10px 0"><strong>${escapeHtml(b.title)}</strong><div class="muted">現在 ${b.current}/${b.total}ページ ・ 今日の目標 ${goal(b).goal===null?'再計画':goal(b).goal+'ページ'}</div><div class="grid"><div><label for="read-${b.id}">今日読んだページ数</label><input id="read-${b.id}" type="number" min="0" max="${b.total-b.current}" placeholder="例：20"></div><div style="display:flex;align-items:end"><button class="primary" style="margin:0" onclick="saveReading('${b.id}')">記録する</button></div></div></div>`).join(''):'登録した本はすべて読了しています。おめでとうございます！';
}
$('bookForm').addEventListener('submit',e=>{
  e.preventDefault();
  const title=$('title').value.trim(), total=Number($('total').value), due=$('due').value, current=Number($('current').value), author=$('author').value.trim();
  if(!title||!Number.isInteger(total)||total<1||!due||!Number.isInteger(current)||current<0||current>total){alert('入力内容を確認してください。読了ページは0〜総ページ数の範囲で入力します。');return;}
  books.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),title,total,due,current,author,history:[]});
  save(); e.target.reset(); $('current').value=0; $('due').value=(()=>{const d=new Date();d.setDate(d.getDate()+14);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`})(); $('title').focus();
});
window.saveReading=id=>{
  const b=books.find(x=>x.id===id), input=$(`read-${id}`); if(!b||!input)return;
  const pages=Number(input.value);
  if(!Number.isInteger(pages)||pages<0||pages>b.total-b.current){alert('0以上、残りページ数以下の整数を入力してください。');return;}
  if(pages===0){alert('1ページ以上読んだときに記録してください。');return;}
  const from=b.current; b.current+=pages;
  b.history=b.history||[]; b.history.push({date:today(),pages,from,to:b.current});
  save();
};
window.logFor=id=>{const input=$(`read-${id}`);if(input){input.focus();input.scrollIntoView({behavior:'smooth',block:'center'});}};
window.editBook=id=>{
  const b=books.find(x=>x.id===id);if(!b)return;
  const title=prompt('本のタイトル',b.title);if(title===null)return;
  const totalText=prompt('総ページ数',String(b.total));if(totalText===null)return;
  const total=Number(totalText);
  const currentText=prompt('現在の読了ページ',String(b.current));if(currentText===null)return;
  const current=Number(currentText);
  const due=prompt('返却期限（YYYY-MM-DD）',b.due);if(due===null)return;
  const author=prompt('著者（任意）',b.author||'');if(author===null)return;
  if(!title.trim()||!Number.isInteger(total)||total<1||!Number.isInteger(current)||current<0||current>total||!/^\d{4}-\d{2}-\d{2}$/.test(due)){alert('入力内容を確認してください。');return;}
  Object.assign(b,{title:title.trim(),total,current,due,author:author.trim()});save();
};
window.deleteBook=id=>{
  const b=books.find(x=>x.id===id);if(!b)return;
  if(confirm(`「${b.title}」を読書履歴ごと削除しますか？この操作は取り消せません。`)){books=books.filter(x=>x.id!==id);save();}
};
$('exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({app:'読書ペースメーカー',version:1,exportedAt:new Date().toISOString(),books},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`読書記録バックアップ_${today()}.json`;a.click();URL.revokeObjectURL(url);
});
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const data=JSON.parse(await f.text()), arr=Array.isArray(data)?data:data.books;
    if(!Array.isArray(arr)||!arr.every(b=>b&&typeof b.title==='string'&&Number.isFinite(b.total)&&Number.isFinite(b.current)&&typeof b.due==='string'))throw Error('format');
    if(confirm('現在のデータを置き換えて、バックアップを読み込みますか？')){books=arr;save();alert('読み込みました。');}
  }catch(err){alert('バックアップファイルを読み込めませんでした。');}
  e.target.value='';
});
render();
</script>
</body>
</html>

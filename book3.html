<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>読書ペースメーカー</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="読書ペース">
<meta name="theme-color" content="#1E5A6B">
<style>
:root{--bg:#EDF1F3;--card:#fff;--ink:#14282E;--sub:#5B6E75;--line:#D5DEE2;--ac:#1E5A6B;--rib:#E2A72E;--ok:#2E8B57;--bad:#B6402F;--bar:#DCE5E8}
@media(prefers-color-scheme:dark){:root{--bg:#10191C;--card:#1A272B;--ink:#E8EFF1;--sub:#8FA3AA;--line:#2B3C41;--ac:#5FB0C6;--rib:#E2A72E;--ok:#5CC48A;--bad:#E27A67;--bar:#2B3C41}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
.serif{font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.hero{position:relative;background:var(--ac);color:#fff;border-radius:6px 6px 18px 18px;padding:22px 20px 18px 64px;margin-bottom:20px}
.hero:before{content:"";position:absolute;left:20px;top:0;width:24px;height:52px;background:var(--rib);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.hero small{display:block;opacity:.85;font-size:14px}
.hero .n{font-size:56px;line-height:1.1;font-weight:700}
.hero .n span{font-size:20px;font-weight:400;margin-left:4px}
.hero p{margin:6px 0 0;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card.over{border-color:var(--bad)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.t{font-weight:700;font-size:17px;line-height:1.4;word-break:break-all}
.tag{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:0 8px;white-space:nowrap}
.bar{height:10px;background:var(--bar);border-radius:5px;margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:5px}
.row{display:flex;justify-content:space-between;font-size:14px;color:var(--sub)}
.go{margin-top:8px;font-weight:700;font-size:16px;color:var(--ac)}
.go.clear{color:var(--ok)}.go.bad{color:var(--bad)}
.acts{display:flex;gap:8px;margin-top:10px}
button{font:inherit;border-radius:10px;border:1px solid var(--ac);background:none;color:var(--ac);padding:8px 14px;min-height:44px}
button.p{background:var(--ac);color:#fff;flex:1}
button.d{border-color:var(--bad);color:var(--bad)}
button.s{min-height:36px;padding:4px 12px;font-size:14px}
.bar-bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:none}
.bar-bottom button{flex:1}
.empty{text-align:center;color:var(--sub);padding:28px 8px}
#m{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9;overflow:auto}
#m.on{display:block}
.sheet{background:var(--card);max-width:560px;margin:5vh auto;border-radius:16px;padding:18px 18px 22px;width:calc(100% - 24px)}
.sheet h2{margin:0 0 12px;font-size:19px}
label{display:block;font-size:14px;color:var(--sub);margin-top:12px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{height:90px;font-size:13px}
.btns{display:flex;gap:8px;margin-top:18px}
.btns button{flex:1}
.stat{display:flex;gap:10px;margin-bottom:14px}
.stat div{flex:1;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--sub)}
.stat b{display:block;font-size:22px;color:var(--ink)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
h3{font-size:15px;margin:18px 0 4px}
details{margin-top:14px}summary{color:var(--sub);padding:6px 0}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.96)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
</head>
<body>
<main>
  <section class="hero" id="hero"></section>
  <div id="list"></div>
</main>
<div class="bar-bottom">
  <button class="p" onclick="bookForm()">＋ 本を追加</button>
  <button onclick="history_()">これまで</button>
</div>
<div id="m" onclick="if(event.target===this)closeM()"></div>
<script>
const K='readingPacemaker.v1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.books)S={books:[],logs:[],seq:1};
const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('保存できませんでした。ブラウザの設定を確認してください。')}};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const[a,b,c]=s.split('-').map(Number);return ymd(new Date(a,b-1,c+n))};
const dn=s=>{const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)/864e5};
const md=s=>{const[,b,c]=s.split('-').map(Number);return b+'/'+c};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const book=id=>S.books.find(b=>b.id===id);
const logsOf=id=>S.logs.filter(l=>l.b===id).sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:x.id-y.id);
const endAt=(id,d)=>{let p=0;for(const l of logsOf(id)){if(l.d<=d)p=l.p;else break}return p};
const cur=id=>endAt(id,'9999-12-31');
function doneDate(b){const by={};logsOf(b.id).forEach(l=>by[l.d]=l.p);for(const d of Object.keys(by).sort())if(by[d]>=b.pages)return d;return null}
function daily(){const m={};for(const b of S.books){let prev=0;const by={};logsOf(b.id).forEach(l=>by[l.d]=l.p);for(const d of Object.keys(by).sort()){const e=by[d];if(e>prev)m[d]=(m[d]||0)+e-prev;prev=e}}return m}
const isDone=b=>cur(b.id)>=b.pages;

function render(){
  const t=today(),y=addDays(t,-1),D=daily(),readT=D[t]||0;
  const act=S.books.filter(b=>!isDone(b)).sort((a,b)=>a.due<b.due?-1:1);
  let left=0;
  const cards=act.map(b=>{
    const c=cur(b.id),rem=b.pages-c,days=dn(b.due)-dn(t)+1,over=days<1,yp=endAt(b.id,y);
    const target=over?rem:Math.ceil((b.pages-yp)/days),l=Math.max(0,target-Math.max(0,c-yp));
    if(!over)left+=l;
    const pct=Math.min(100,Math.round(c/b.pages*100));
    const due=over?`期限切れ(${md(b.due)})`:`${md(b.due)}まで(${days===1?'今日':'あと'+(days-1)+'日'})`;
    const go=over?`<div class="go bad">残り${rem}ページ。期限を見直しましょう</div>`
      :l>0?`<div class="go">今日あと${l}ページ</div>`:`<div class="go clear">今日の分クリア ✓</div>`;
    return `<div class="card${over?' over':''}"><div class="top"><div class="t">${esc(b.title)}</div><span class="tag">${b.kind==='own'?'自分の本':'図書館'}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="row"><span>${c} / ${b.pages}ページ(${pct}%)</span><span>${due}</span></div>${go}
    <div class="acts"><button class="p" onclick="rec(${b.id})">どこまで読んだ？</button><button onclick="bookForm(${b.id})">編集</button></div></div>`}).join('');
  let msg='';
  if(!act.length)msg='借りた本を登録しましょう';
  else if(left===0)msg='今日の分は全部クリア 🎉';
  else msg=`今日の目標まで、あと${left}ページ`;
  $('#hero').innerHTML=`<small>今日読んだページ</small><div class="n serif">${readT}<span>ページ</span></div><p>${msg}</p>`;
  $('#list').innerHTML=cards||'<div class="empty">読んでいる本はありません。<br>「＋ 本を追加」から登録してください。</div>';
}
function openM(h){$('#m').innerHTML='<div class="sheet">'+h+'</div>';$('#m').classList.add('on');$('#m').scrollTop=0}
function closeM(){$('#m').classList.remove('on');$('#m').innerHTML=''}

function bookForm(id){
  const b=id?book(id):{title:'',pages:'',kind:'lib',due:addDays(today(),14)};
  openM(`<h2>${id?'本の情報を編集':'本を追加'}</h2>
  <label>題名</label><input id="f1" value="${esc(b.title)}">
  <label>総ページ数</label><input id="f2" type="number" inputmode="numeric" min="1" value="${b.pages}">
  <label>種類</label><select id="f3"><option value="lib"${b.kind==='lib'?' selected':''}>図書館の本</option><option value="own"${b.kind==='own'?' selected':''}>自分の本</option></select>
  <label id="f4l"></label><input id="f4" type="date" value="${b.due}">
  <div class="btns"><button onclick="closeM()">やめる</button><button class="p" onclick="saveBook(${id||0})">保存</button></div>
  ${id?`<div class="btns"><button class="d" onclick="delBook(${id})">この本を削除</button></div>`:''}`);
  const sync=()=>$('#f4l').textContent=$('#f3').value==='own'?'読み切りたい日':'返却期限(延長したら変更)';
  $('#f3').onchange=sync;sync();
}
function saveBook(id){
  const title=$('#f1').value.trim(),pages=parseInt($('#f2').value,10),due=$('#f4').value;
  if(!title||!(pages>0)||!due){alert('題名・総ページ数・期限を入れてください');return}
  const o={title,pages,kind:$('#f3').value,due};
  if(id)Object.assign(book(id),o);else S.books.push({id:S.seq++,...o});
  save();closeM();render();
}
function delBook(id){
  if(!confirm('この本と、その読書記録をすべて削除します。よいですか？'))return;
  S.books=S.books.filter(b=>b.id!==id);S.logs=S.logs.filter(l=>l.b!==id);save();closeM();render();
}
function rec(id){
  const b=book(id);
  openM(`<h2>${esc(b.title)}</h2><p style="margin:0;color:var(--sub)">いま ${cur(id)} / ${b.pages}ページ</p>
  <label>いま何ページまで読んだ？</label><input id="r1" type="number" inputmode="numeric" min="0" max="${b.pages}" placeholder="例: 120">
  <label>日付(前日分なら変更)</label><input id="r2" type="date" value="${today()}">
  <div class="btns"><button onclick="closeM()">やめる</button><button class="p" onclick="saveRec(${id})">記録する</button></div>`);
  setTimeout(()=>$('#r1').focus(),50);
}
function saveRec(id){
  const b=book(id),p=parseInt($('#r1').value,10),d=$('#r2').value;
  if(!(p>=0&&p<=b.pages)||!d){alert(`0〜${b.pages}の範囲でページ数を入れてください`);return}
  S.logs.push({id:S.seq++,b:id,d,p});save();closeM();render();
  const h=$('#hero');h.classList.remove('pop');void h.offsetWidth;h.classList.add('pop');
}
function editLog(id){
  const l=S.logs.find(x=>x.id===id),b=book(l.b);
  openM(`<h2>記録を修正</h2><p style="margin:0;color:var(--sub)">${esc(b.title)}</p>
  <label>ページ数(0〜${b.pages})</label><input id="e1" type="number" inputmode="numeric" value="${l.p}">
  <label>日付</label><input id="e2" type="date" value="${l.d}">
  <div class="btns"><button onclick="history_()">戻る</button><button class="p" onclick="saveLog(${id})">保存</button></div>
  <div class="btns"><button class="d" onclick="delLog(${id})">この記録を削除</button></div>`);
}
function saveLog(id){
  const l=S.logs.find(x=>x.id===id),b=book(l.b),p=parseInt($('#e1').value,10),d=$('#e2').value;
  if(!(p>=0&&p<=b.pages)||!d){alert(`0〜${b.pages}の範囲でページ数を入れてください`);return}
  l.p=p;l.d=d;save();render();history_();
}
function delLog(id){if(!confirm('この記録を削除しますか？'))return;S.logs=S.logs.filter(x=>x.id!==id);save();render();history_()}

function history_(){
  const D=daily(),total=Object.values(D).reduce((a,b)=>a+b,0),mon=today().slice(0,7);
  const thisM=Object.entries(D).filter(([d])=>d.startsWith(mon)).reduce((a,[,v])=>a+v,0);
  const fin=S.books.filter(isDone).map(b=>({b,d:doneDate(b)})).sort((a,b)=>a.d<b.d?1:-1);
  const months={};Object.entries(D).forEach(([d,v])=>months[d.slice(0,7)]=(months[d.slice(0,7)]||0)+v);
  const mh=Object.keys(months).sort().reverse().map(m=>`<div class="li"><span>${m.replace('-','年')}月</span><b>${months[m]}ページ</b></div>`).join('')||'<div class="empty">まだ記録がありません</div>';
  const fh=fin.map(({b,d})=>`<div class="li"><span>${esc(b.title)}<br><small style="color:var(--sub)">${b.pages}ページ・${d.replace(/-/g,'/')}に読了</small></span><button class="s" onclick="bookForm(${b.id})">編集</button></div>`).join('')||'<div class="empty">読み終えた本がここに並びます</div>';
  const lh=[...S.logs].sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.id-a.id).slice(0,100).map(l=>{const b=book(l.b);return `<div class="li"><span>${md(l.d)} ${esc(b?b.title:'')}<br><small style="color:var(--sub)">${l.p}ページまで</small></span><button class="s" onclick="editLog(${l.id})">修正</button></div>`}).join('')||'<div class="empty">記録なし</div>';
  openM(`<h2>これまで</h2>
  <div class="stat"><div>累計<b class="serif">${total}</b>ページ</div><div>今月<b class="serif">${thisM}</b>ページ</div><div>読了<b class="serif">${fin.length}</b>冊</div></div>
  <h3>読み終えた本</h3>${fh}<h3>月ごとの読書量</h3>${mh}
  <details><summary>記録の一覧(修正・削除)</summary>${lh}</details>
  <details><summary>保存と復元</summary>
   <p style="font-size:13px;color:var(--sub);margin:4px 0">データはこの端末のブラウザ内にあります。念のため、ときどき書き出してメモなどに控えておくと安心です。</p>
   <textarea id="bk" placeholder="ここに書き出し／貼り付け"></textarea>
   <div class="btns"><button onclick="exp()">書き出す</button><button onclick="imp()">読み込む</button></div></details>
  <div class="btns"><button class="p" onclick="closeM()">閉じる</button></div>`);
}
function exp(){const t=JSON.stringify(S);$('#bk').value=t;$('#bk').select();try{navigator.clipboard.writeText(t)}catch(e){}}
function imp(){
  try{const o=JSON.parse($('#bk').value);if(!Array.isArray(o.books)||!Array.isArray(o.logs))throw 0;
    if(!confirm('いまのデータを、貼り付けた内容で置き換えます。よいですか？'))return;
    S={books:o.books,logs:o.logs,seq:o.seq||1000000};save();render();history_();
  }catch(e){alert('読み込めませんでした。書き出した内容を、そのまま貼り付けてください。')}
}
render();
</script>
</body>
</html>
